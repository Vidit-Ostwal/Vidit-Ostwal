<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="80">
        <animate attributeName="width" from="0" to="470" begin="3.3s" dur="1s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="#0a0e0c" />

  <!-- terminal window -->
  <rect x="24" y="20" width="1152" height="280" rx="6" fill="#0d1210" stroke="#1c2420" stroke-width="1.5" />
  <rect x="24" y="20" width="1152" height="36" rx="6" fill="#111713" />
  <rect x="24" y="50" width="1152" height="6" fill="#111713" />
  <circle cx="48" cy="38" r="6" fill="#ff5f56" />
  <circle cx="70" cy="38" r="6" fill="#ffbd2e" />
  <circle cx="92" cy="38" r="6" fill="#27c93f" />
  <text x="130" y="43" font-size="13" fill="#5a6b61">vidit@github:~</text>

  <!-- log glow behind resolved name -->
  <ellipse cx="300" cy="238" rx="260" ry="60" fill="#3ddc84" opacity="0.1" filter="url(#glow)" />

  <!-- log lines -->
  <g opacity="0" transform="translate(0,8)">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0,8" to="0,0" begin="0.4s" dur="0.4s" fill="freeze" />
    <text x="56" y="100" font-size="15"><tspan fill="#5a6b61">[exp] </tspan><tspan fill="#5a6b61">piramal capital (genai eng.) -&gt; crewAI (oss developer)</tspan></text>
  </g>

  <g opacity="0" transform="translate(0,8)">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.4s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0,8" to="0,0" begin="1.0s" dur="0.4s" fill="freeze" />
    <text x="56" y="126" font-size="15"><tspan fill="#d9a440">[oss] </tspan><tspan fill="#5a6b61">crewai (125 prs, #6) - ragas - github-mcp - openenv</tspan></text>
  </g>

  <g opacity="0" transform="translate(0,8)">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0,8" to="0,0" begin="1.6s" dur="0.4s" fill="freeze" />
    <text x="56" y="152" font-size="15"><tspan fill="#3ddc84">[ship] </tspan><tspan fill="#5a6b61">maze-bench - price-negotiation-rl - ui-fixing-harness</tspan></text>
  </g>

  <g opacity="0" transform="translate(0,8)">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0,8" to="0,0" begin="2.2s" dur="0.4s" fill="freeze" />
    <text x="56" y="178" font-size="15"><tspan fill="#3ddc84">[now] </tspan><tspan fill="#5a6b61">building rl environments &amp; open source, full-time</tspan></text>
  </g>

  <!-- prompt -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.3s" fill="freeze" />
    <text x="56" y="215" font-size="20"><tspan fill="#3ddc84">$ </tspan><tspan fill="#8a9a90">whoami</tspan></text>
  </g>

  <!-- resolved name, typewriter reveal -->
  <g clip-path="url(#typeClip)">
    <text x="56" y="263" font-size="54" font-weight="700" fill="#eafbf0" letter-spacing="1">VIDIT OSTWAL</text>
  </g>

  <!-- subtitle -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.5s" fill="freeze" />
    <text x="58" y="286" font-size="16" fill="#5a6b61">ml/ai engineer building agents and rl environments</text>
  </g>

  <!-- blinking cursor -->
  <rect x="534" y="218" width="14" height="44" fill="#3ddc84" opacity="0">
    <animate attributeName="opacity" begin="4.3s" dur="1s" values="0;1;1;0;0" keyTimes="0;0.05;0.5;0.55;1" repeatCount="indefinite" />
  </rect>
</svg>
